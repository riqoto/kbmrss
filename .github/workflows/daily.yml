name: daily-fetch
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # 08:00 TR
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i
      - run: node fetch.mjs
      - name: Bookmark backup
        run: curl -fsS -H "x-team-code: ${{ secrets.TEAM_CODE }}" "${{ vars.SITE_URL }}/api/bookmarks" -o data/bookmarks.json || true
      - run: |
          git config user.name radar-bot && git config user.email bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
